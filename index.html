<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #f5f7fa;
        font-family: Arial, sans-serif;
        color: #222;
    }

    .container {
        width: 100%;
        max-width: 650px;
        margin: auto;
        padding: 18px 14px 35px;
    }

    /* ================= HEADER ================= */

    .header {
        background: #159fda;
        padding: 24px 18px;
        border-radius: 0 0 10px 10px;
        margin-bottom: 18px;
        color: white;
    }

    .header h1 {
        margin: 0;
        font-size: 23px;
        font-weight: 700;
        letter-spacing: .5px;
    }

    .username {
        margin-top: 4px;
        font-size: 11px;
        color: rgba(255,255,255,.72);
        letter-spacing: 1px;
    }

    /* ================= OPERATOR ================= */

    .operator {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
    }

    .operator button {
        flex: 1;
        padding: 10px 5px;
        border: 1px solid #d5dce4;
        border-radius: 9px;
        background: white;
        color: #333;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
    }

    .operator button.active {
        background: #159fda;
        color: white;
        border-color: #159fda;
    } 

   .operator button.tri.active {
        background: #18a558;
        border-color: #18a558;
    }

    .operator button.telkomsel.active {
        background: #e53935;
        border-color: #e53935;
   }

 

    /* ================= FILTER ================= */

    .filter-area {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
        margin-bottom: 14px;
    }

    .filter-area button {
        white-space: nowrap;
        background: white;
        border: 1px solid #d5dce4;
        border-radius: 9px;
        padding: 9px 13px;
        font-size: 11px;
        color: #333;
        cursor: pointer;
    }

    .filter-area button.active {
        background: #e6f6fd;
        border-color: #159fda;
        color: #0787bd;
    }

    /* ================= INFO ================= */

    .info {
        font-size: 12px;
        color: #777;
        margin: 8px 2px 10px;
    }

    /* ================= PRODUCT ================= */

    .products {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .product {
        position: relative;
        background: white;
        border: 1px solid #d8dde3;
        border-radius: 12px;
        padding: 13px 14px;
        cursor: pointer;
        transition: .15s;
    }

    .product:hover {
        border-color: #159fda;
    }

    .product.selected {
        border: 2px solid #159fda;
        background: #f2fbff;
    }

    .product-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    .product-code {
        font-size: 14px;
        font-weight: 700;
        color: #222;
    }

    .price {
        color: #078fca;
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
    }

    .product-info {
        margin-top: 6px;
        font-size: 11px;
        color: #6d6d6d;
        line-height: 1.5;
        padding-right: 60px;
    }

    .active-time {
        margin-top: 4px;
        font-size: 10px;
        color: #999;
    }

    /* tanda centang ketika dipilih */

    .check {
        display: none;
        position: absolute;
        right: 12px;
        bottom: 9px;
        font-size: 11px;
        color: #159fda;
        font-weight: bold;
    }

    .product.selected .check {
        display: block;
    }

    /* ================= LANJUTKAN ================= */

    .continue {
        width: 100%;
        margin-top: 18px;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #d9dce0;
        color: #777;
        font-size: 13px;
        font-weight: bold;
        cursor: not-allowed;
    }

    .continue.ready {
        background: #159fda;
        color: white;
        cursor: pointer;
    }

    /* ================= EMPTY ================= */

    .empty {
        background: white;
        border-radius: 10px;
        padding: 25px;
        text-align: center;
        color: #888;
        font-size: 12px;
    }

    /* ================= FOOTER ================= */

    .footer {
        text-align: center;
        margin-top: 22px;
        color: #aaa;
        font-size: 10px;
    }

</style>
</head>

/* =====================================================
   PENGATURAN

let operatorSekarang = "AXIS";
let filterSekarang = "SEMUA";
let produkTerpilih = null;


/* =====================================================
   FORMAT HARGA
===================================================== */

function formatHarga(harga) {
    return "Rp" + harga.toLocaleString("id-ID");
}


/* =====================================================
   GANTI OPERATOR
===================================================== */

function gantiOperator(operator, tombol) {

    operatorSekarang = operator;
    filterSekarang = "SEMUA";
    produkTerpilih = null;

    document.querySelectorAll(".operator button")
        .forEach(btn => btn.classList.remove("active"));

    tombol.classList.add("active");

    tampilkanFilter();
    tampilkanProduk();
    updateButton();

}


/* =====================================================
   FILTER
===================================================== */

function tampilkanFilter() {

    const area = document.getElementById("filterArea");

    const produk = data[operatorSekarang];

    const masaAktif = [
        ...new Set(produk.map(item => item.masa))
    ];

    area.innerAXIS = "";

    const semua = document.createElement("button");

    semua.innerText = "Tampilkan Semua";

    if (filterSekarang === "SEMUA") {
        semua.classList.add("active");
    }

    semua.onclick = function() {
        filterSekarang = "SEMUA";
        produkTerpilih = null;
        tampilkanFilter();
        tampilkanProduk();
        updateButton();
    };

    area.appendChild(semua);


    masaAktif.forEach(masa => {

        const button = document.createElement("button");

        button.innerText = masa;

        if (filterSekarang === masa) {
            button.classList.add("active");
        }

        button.onclick = function() {

            filterSekarang = masa;
            produkTerpilih = null;

            tampilkanFilter();
            tampilkanProduk();
            updateButton();

        };

        area.appendChild(button);

    });

}


/* =====================================================
   TAMPILKAN PRODUK
===================================================== */

function tampilkanProduk() {

    const container = document.getElementById("products");

    let produk = data[operatorSekarang];

    if (filterSekarang !== "SEMUA") {

        produk = produk.filter(
            item => item.masa === filterSekarang
        );

    }

    container.innerHTML = "";


    if (produk.length === 0) {

        container.innerHTML = `
            <div class="empty">
                Paket tidak tersedia.
            </div>
        `;

        return;
    }


    produk.forEach((item, index) => {

        const div = document.createElement("div");

        div.className = "product";

        div.innerHTML = `

            <div class="product-top">

                <div class="product-code">
                    ${item.kode}
                </div>

                <div class="price">
                    ${formatHarga(item.harga)}
                </div>

            </div>

            <div class="product-info">
                ${operatorSekarang} ${item.kuota}
            </div>

            <div class="active-time">
                Masa aktif ${item.masa}
            </div>

            <div class="check">
                ✓ Dipilih
            </div>
        `;


        div.onclick = function() {

            document.querySelectorAll(".product")
                .forEach(p => p.classList.remove("selected"));

            div.classList.add("selected");

            produkTerpilih = item;

            updateButton();

        };


        container.appendChild(div);

    });

}


/* =====================================================
   TOMBOL LANJUTKAN
===================================================== */

function updateButton() {

    const button = document.getElementById("continueButton");

    if (produkTerpilih) {

        button.disabled = false;
        button.classList.add("ready");

    } else {

        button.disabled = true;
        button.classList.remove("ready");

    }

}

Harga: ${formatHarga(produkTerpilih.harga)}
Nomor : (opsional)

Terima kasih 😊`;


    const link =
        "https://wa.me/" +
        nomorWhatsApp +
        "?text=" +
        encodeURIComponent(pesan);


    window.open(link, "_blank");

}
